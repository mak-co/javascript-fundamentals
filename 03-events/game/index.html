<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #box {
        width: 600px;
        height: 400px;
        border: 2px solid black;
        position: relative;
        overflow: hidden;
        
    }

    #ball {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: red;
        position: absolute;
    }

    .bricks{
        width: 40px;
        height: 20px;
        background-color: yellow;
        border: solid 2px black;
    }

    .container{
        align-items: center;
        justify-content: center;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 15px;
        width: 100%;
        border: solid 2px red;
    }

    #movingBar{
        width: 60px;
        height: 4px;
        background-color:blue;
        position: absolute;
                overflow: hidden;


    }



</style>

<body>

    <div id="box">

        <!-- container for the bricks -->
<div class=" container">
            <!-- bricks -->
        <div class="bricks"></div>
</div>


        <div id="ball"></div>

        <!-- moving bar -->
         <div id="movingBar"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
