<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: black;
    }

    #box {
        width: 600px;
        height: 400px;
        border: solid 4px limegreen;
        position: absolute;
        overflow: hidden;


    }

    #ball {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: red;
        position: absolute;
    }

    .bricks {
        width: 40px;
        height: 20px;
        background-color: yellow;
        border: solid 2px black;
    }

    .container {
        align-items: center;
        justify-content: center;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 15px;
        width: 100%;

    }

    #movingBar {
        width: 60px;
        height: 4px;
        background-color: blue;
        position: absolute;



    }


    h2 {
        text-align: center;

        color: black;
        font-size: 70px;
       display: none;
    }

   #gameOver{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:90px;
    color:red;
}




</style>

<body>

    <div id="box">

        <!-- container for the bricks -->
        <div class=" container">
            <!-- bricks -->
            <div class="bricks">
            </div>
        </div>


        <!-- ball -->
        <div id="ball"></div>

        <!-- gameOver -->

        <!-- moving bar -->
        <div id="movingBar"></div>
        
        <div>
        <h2 id="gameOver">Game Over</h2>
        
    </div>

    </div>
    
    </div>



    <script src="script.js"></script>

</body>

</html>
