<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>


    <div class="box">


        <!-- question mcq card -->

        <div id="queCard" class="">
            <h2 class="que">1) Do you open Snapchat at the dinner table?</h2>
            <div id="colOpTimer">
                <div class="options">
                    <div class="option">
                        <input type="radio" name="answer" id="r1">
                        <label for="1" id="op1">Never</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="answer" id="r2">
                        <label for="2" id="op2">Always</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="answer" id="r3">
                        <label for="3" id="op3">Sometimes</label>
                    </div>
                    <div class="option">
                        <input type="radio" name="answer" id="r4">
                        <label for="4" id="op4">Rarely</label>
                    </div>
                </div>
                <div id="timer"></div>

            </div>
            <button id="save">Save Answer</button>


        </div>










        <div id="card" class="disabled">
            <h1>Analysing....</h1>

            <div id="download-bar">
                <div id="tracker"></div>
                <h3>...</h3>
            </div>
        </div>
        <div id="result" class="disabled">
            <h1>Congrats You are 100% GAY!</h1>
        </div>
    </div>



    </div>




    <script src="script.js"></script>
</body>

</html>
